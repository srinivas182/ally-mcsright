# Full test suite on real MySQL whenever a pull request changes database tables.
#
# Why: the main CI runs on SQLite, which does not enforce column lengths, strict types or some index rules,
# so a migration can pass there and fail in production (Sprint 14B-5: a too-short column). This job runs the
# whole suite on MySQL 8.4 only for pull requests that touch migrations, keeping CI minutes low otherwise.
name: Full suite on MySQL (schema changes)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'database/migrations/**'
      - 'modules/*/database/migrations/**'
      - '.github/workflows/schema-mysql.yml'
  workflow_dispatch:

concurrency:
  group: schema-mysql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  schema-mysql:
    name: Full suite on MySQL 8.4
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: rightally_test
          MYSQL_USER: rightally
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: root
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
        ports:
          - 3306:3306

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: rightally_test
      DB_USERNAME: rightally
      DB_PASSWORD: secret
      DB_ADMIN_USERNAME: root
      DB_ADMIN_PASSWORD: root

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}

      - name: PDF and OCR tools (qpdf normalises forms; Tesseract reads scans)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qpdf poppler-utils tesseract-ocr

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Allow trigger creation with binary logging (RDS parameter equivalent)
        run: mysql -h 127.0.0.1 -uroot -proot -e "SET PERSIST log_bin_trust_function_creators = 1;"

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Every test on MySQL
        run: vendor/bin/pest
