name: Vendor bundle (temporary tooling)
on:
  push:
    branches: [tooling/vendor-bundle]
permissions:
  contents: write
jobs:
  bundle:
    if: ${{ !contains(github.event.head_commit.message, '[bundle]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist --no-scripts
      - run: tar -czf vendor.tgz vendor
      - name: Commit the bundle to this temporary branch
        run: |
          git config user.name "vendor-bundle"
          git config user.email "vendor-bundle@users.noreply.github.com"
          git add -f vendor.tgz
          git commit -m "[bundle] vendor.tgz"
          git push origin HEAD:tooling/vendor-bundle
