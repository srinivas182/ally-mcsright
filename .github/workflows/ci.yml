# RightAlly CI
#
# Efficient-minutes policy:
#  - Draft pull requests run only the quick job (style + static analysis + types).
#  - The full job (tests + production build) runs once the PR is marked ready.
#  - No run on push to main: code on main has already passed CI in its PR.
#  - Docs-only changes skip CI entirely; superseded runs are cancelled.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick:
    name: Quick checks (style, static analysis, types)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2, cs2pr
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}

      - name: PDF tools (qpdf normalises uploaded forms)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qpdf poppler-utils

      - run: composer install --no-interaction --no-progress --prefer-dist

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Prepare application and generate route helpers
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan wayfinder:generate --with-form

      - name: PHP style (Pint)
        run: vendor/bin/pint --test --format=checkstyle | cs2pr

      - name: PHP static analysis (PHPStan level 8)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G --error-format=github

      - name: Design tokens up to date
        run: php artisan design:tokens --check

      - name: Front-end lint and format
        run: npm run check

      - name: TypeScript types
        run: npm run types:check

  full:
    name: Tests and production build
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    needs: quick
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}

      - name: PDF tools (qpdf normalises uploaded forms)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qpdf poppler-utils

      - run: composer install --no-interaction --no-progress --prefer-dist

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Production build
        run: npm run build

      - name: Front-end component tests
        run: npm run test

      - name: Test suite (Pest)
        run: php artisan test --parallel

      - name: Report failing tests as annotations
        if: failure()
        run: |
          vendor/bin/pest --compact 2>&1 | grep -E "FAILED|Exception|Error|Failed asserting|➜" | head -30 | sed 's/^/::error::/' || true
          (which qpdf || echo "qpdf not found") | sed 's/^/::error::qpdf path: /'
          (qpdf --version 2>&1 | head -1) | sed 's/^/::error::qpdf version: /'
          php -r 'require "vendor/autoload.php"; $p = new FPDF("P", "pt", "Letter"); $p->AddPage(); $p->SetFont("Helvetica", "", 12); $p->Text(72, 60, "X"); file_put_contents("/tmp/ci.pdf", $p->Output("S")); passthru("qpdf --object-streams=disable --decrypt /tmp/ci.pdf /tmp/ci2.pdf 2>&1; echo exit=$?");' 2>&1 | sed 's/^/::error::normalise: /' || true
