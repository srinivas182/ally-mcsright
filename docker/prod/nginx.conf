# RightAlly production web server (DP1). Visitors reach it through Cloudflare and then the server's own web server
# (WHM's Apache on the VPS; a load balancer later), always over HTTPS. It listens only inside Docker; compose.prod.yaml
# publishes it on 127.0.0.1, so nothing outside the server can reach it directly.
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 55m;
    server_tokens off;

    # The visitor's real address, from Cloudflare (the requests come through the server's web server on Docker's network).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Built screens and website assets never change under the same name.
    location ~ ^/(build|site-assets)/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        # Every outside request arrived over HTTPS (Cloudflare and the front web server only forward HTTPS).
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_read_timeout 70s;
        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;
    }

    # Never serve dotfiles (.env, .git)
    location ~ /\.(?!well-known) {
        deny all;
    }
}
