; RightAlly PHP-FPM pool (DP1). Sized for a shared VPS: raise pm.max_children on a bigger server
; (about 60 MB each), or set it from the server size in compose.prod.yaml.
[www]
pm = dynamic
pm.max_children = ${FPM_MAX_CHILDREN}
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 1000
request_terminate_timeout = 65s
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
