# Local development stack: app (PHP 8.5-FPM), nginx, MySQL 8.4 LTS, Redis.
# Usage: docker compose up -d && docker compose exec app composer setup
services:
    app:
        build: ./docker/php
        volumes:
            - ./:/var/www/html
        depends_on:
            - mysql
            - redis
        environment:
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_DATABASE: rightally
            DB_USERNAME: rightally
            DB_PASSWORD: secret
            REDIS_HOST: redis

    nginx:
        image: nginx:1.27-alpine
        ports:
            - '8080:80'
        volumes:
            - ./:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app

    mysql:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: rightally
            MYSQL_USER: rightally
            MYSQL_PASSWORD: secret
            MYSQL_ROOT_PASSWORD: root
        ports:
            - '33060:3306'
        volumes:
            - mysql-data:/var/lib/mysql

    redis:
        image: redis:7-alpine

volumes:
    mysql-data:
